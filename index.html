<style>
  :root{
    --bg:#131314; --surface:#1e1f20; --surface2:#28292a; --line:#2b2d30;
    --text:#e8eaed; --muted:#9aa0a6; --outline:#444746;
    --primary:#8ab4f8; --primary2:#c58af9; --on-primary:#062e6f;
    --green:#81c995; --red:#f28b82; --amber:#fdd663;
    --radius:20px;
    --bar:rgba(19,19,20,.88); --badge-bg:rgba(15,15,16,.72);
    --glow:rgba(138,180,248,.10); --pet-grad:linear-gradient(140deg,#1b2437 0%,#1e1f20 60%);
    --input-bg:rgba(19,19,20,.6); --shadow:0 14px 40px rgba(0,0,0,.45);
    --bgimg-op:.08;
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --surface:#f8f9fa; --surface2:#f1f3f4; --line:#e8eaed;
    --text:#202124; --muted:#5f6368; --outline:#dadce0;
    --primary:#1a73e8; --primary2:#9334e6; --on-primary:#ffffff;
    --green:#188038; --red:#d93025; --amber:#b06000;
    --bar:rgba(255,255,255,.88); --badge-bg:rgba(255,255,255,.82);
    --glow:rgba(26,115,232,.07); --pet-grad:linear-gradient(140deg,#e8f0fe 0%,#f8f9fa 60%);
    --input-bg:#ffffff; --shadow:0 14px 40px rgba(60,64,67,.18);
    --bgimg-op:.16;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--text); line-height:1.55;

    -webkit-font-smoothing:antialiased;}
  body::before{content:""; position:fixed; inset:0; z-index:-1;
    background:radial-gradient(900px 420px at 50% -80px, var(--glow), transparent 70%);}
  body::after{content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    opacity:var(--bgimg-op);
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' preserveAspectRatio='xMidYMid slice'><defs><filter id='b' x='-10%25' y='-10%25' width='120%25' height='120%25'><feGaussianBlur stdDeviation='24'/></filter></defs><g filter='url(%23b)'><rect width='1600' height='320' fill='%23FF9933'/><rect y='320' width='1600' height='280' fill='%23ffffff'/><rect y='600' width='1600' height='300' fill='%23138808'/><circle cx='800' cy='460' r='95' fill='none' stroke='%23000080' stroke-width='16'/><g fill='%23293042'><circle cx='140' cy='700' r='34'/><rect x='90' y='736' width='100' height='180' rx='50'/><circle cx='330' cy='720' r='30'/><rect x='285' y='752' width='90' height='160' rx='45'/><circle cx='520' cy='695' r='36'/><rect x='466' y='733' width='108' height='180' rx='54'/><circle cx='710' cy='725' r='28'/><rect x='668' y='755' width='84' height='150' rx='42'/><circle cx='900' cy='700' r='34'/><rect x='850' y='736' width='100' height='175' rx='50'/><circle cx='1090' cy='720' r='30'/><rect x='1045' y='752' width='90' height='160' rx='45'/><circle cx='1280' cy='698' r='35'/><rect x='1228' y='735' width='104' height='178' rx='52'/><circle cx='1460' cy='722' r='29'/><rect x='1416' y='753' width='88' height='155' rx='44'/></g><g><rect x='250' y='500' width='7' height='210' fill='%23444'/><rect x='257' y='500' width='120' height='26' fill='%23FF9933'/><rect x='257' y='526' width='120' height='26' fill='%23ffffff'/><rect x='257' y='552' width='120' height='26' fill='%23138808'/><rect x='640' y='470' width='7' height='240' fill='%23444'/><rect x='647' y='470' width='130' height='28' fill='%23FF9933'/><rect x='647' y='498' width='130' height='28' fill='%23ffffff'/><rect x='647' y='526' width='130' height='28' fill='%23138808'/><rect x='1030' y='490' width='7' height='225' fill='%23444'/><rect x='1037' y='490' width='125' height='27' fill='%23FF9933'/><rect x='1037' y='517' width='125' height='27' fill='%23ffffff'/><rect x='1037' y='544' width='125' height='27' fill='%23138808'/><rect x='1380' y='510' width='7' height='205' fill='%23444'/><rect x='1387' y='510' width='115' height='25' fill='%23FF9933'/><rect x='1387' y='535' width='115' height='25' fill='%23ffffff'/><rect x='1387' y='560' width='115' height='25' fill='%23138808'/></g></g></svg>") center/cover no-repeat;}
  a{color:var(--primary); text-decoration:none;}
  a:hover{text-decoration:underline;}
  .wrap{max-width:1240px; margin:0 auto; padding:0 1.25rem;}

  /* ---------- top bar ---------- */
  .topbar{position:sticky; top:0; z-index:30; background:var(--bar); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);}
  .topbar-in{display:flex; align-items:center; justify-content:space-between; height:60px;}
  .brand{font-size:1.02rem; font-weight:600; color:var(--text); letter-spacing:.2px; display:flex; align-items:center; gap:.55rem;}
  .brand .fist{font-size:1.25rem;}
  .brand .dot{color:var(--primary);}
  .lang-toggle{display:flex; border:1px solid var(--outline); border-radius:999px; overflow:hidden;}
  .lang-toggle button{background:transparent; border:none; color:var(--muted); padding:.45rem 1.05rem; font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit;}
  .lang-toggle button.active{background:var(--primary); color:var(--on-primary);}
  .nav-link{color:var(--text); font-size:.87rem; font-weight:600; text-decoration:none; white-space:nowrap;}
  .nav-link:hover{color:var(--green); text-decoration:none;}
  section.appr{margin-bottom:2.5rem; scroll-margin-top:70px;}

  /* ---------- hero ---------- */
  .hero{text-align:center; padding:4.8rem 1rem 3rem;}
  .overline{display:inline-flex; align-items:center; gap:.5rem; font-size:.82rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--primary); background:rgba(138,180,248,.1); border:1px solid rgba(138,180,248,.25); padding:.45rem 1.1rem; border-radius:999px;}
  .hero h1{margin-top:1.4rem; font-size:clamp(2.3rem,6vw,4.1rem); font-weight:800; letter-spacing:-.03em; line-height:1.08;}
  .hero h1 span{background:linear-gradient(92deg,var(--primary),var(--primary2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero .tagline{margin:1.1rem auto 0; font-size:clamp(1.05rem,2.4vw,1.3rem); color:var(--text); font-weight:600; max-width:760px;}
  .hero .msg{margin:.9rem auto 0; font-size:clamp(.95rem,2vw,1.08rem); color:var(--muted); max-width:720px;}
  .cta{display:flex; gap:.8rem; justify-content:center; margin-top:2rem; flex-wrap:wrap;}
  .btn{display:inline-flex; align-items:center; gap:.5rem; padding:.85rem 1.9rem; border-radius:999px; font-size:1rem; font-weight:600; font-family:inherit; cursor:pointer; border:none; transition:transform .18s, filter .18s;}
  .btn-fill{background:var(--primary); color:var(--on-primary);}
  .btn-fill:hover{filter:brightness(1.1); transform:translateY(-1px);}
  .btn-line{background:transparent; color:var(--primary); border:1px solid var(--outline);}
  .btn-line:hover{background:var(--surface2);}
  .counts{display:flex; gap:2.6rem; justify-content:center; margin-top:3rem; flex-wrap:wrap;}
  .count-card{text-align:center; min-width:100px;}
  .count-card .num{font-size:2.3rem; font-weight:800; letter-spacing:-.02em;}
  .count-card .lbl{font-size:.76rem; color:var(--muted); margin-top:.15rem; letter-spacing:.08em; text-transform:uppercase; font-weight:600;}
  .num.green{color:var(--green);} .num.red{color:var(--red);} .num.amber{color:var(--amber);} .num.blue{color:var(--primary);}

  /* ---------- appreciation wall ---------- */
  section.appr{text-align:center; padding:1.6rem 0 .4rem;}
  section.appr h2{font-size:clamp(1.45rem,3.2vw,2rem); font-weight:800; letter-spacing:-.02em; color:var(--green);}
  section.appr > .wrap > p{color:var(--muted); margin-top:.45rem; max-width:640px; margin-left:auto; margin-right:auto;}
  .appr-row{display:flex; gap:1rem; overflow-x:auto; padding:1.5rem .2rem 1rem; scrollbar-width:thin;}
  .appr-card{flex:0 0 255px; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--green); border-radius:var(--radius); overflow:hidden; text-align:left; transition:transform .2s, box-shadow .2s;}
  .appr-card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
  .appr-photo{height:150px; position:relative; overflow:hidden; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:2.2rem; font-weight:800;}
  .appr-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 18%; opacity:0; transition:opacity .4s;}
  .appr-photo img.loaded{opacity:1;}
  .appr-photo .badge{top:8px; right:8px;}
  .appr-body{padding:.85rem 1rem 1rem;}
  .appr-name{font-weight:700; font-size:.98rem;}
  .appr-note{font-size:.8rem; color:var(--muted); margin-top:.3rem; line-height:1.45;}
  .appr-body a{display:inline-block; font-size:.76rem; margin-top:.45rem;}

  /* ---------- chips ---------- */
  nav.tabs{position:sticky; top:60px; z-index:20; background:var(--bar); backdrop-filter:blur(14px); padding:.85rem 0; border-bottom:1px solid var(--line);}
  .tabs-in{display:flex; gap:.55rem; overflow-x:auto; scrollbar-width:none; padding:2px;}
  .tabs-in::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; border:1px solid var(--outline); background:transparent; color:var(--text); padding:.52rem 1.1rem; border-radius:999px; cursor:pointer; font-size:.88rem; font-weight:500; font-family:inherit; transition:background .15s,color .15s,border-color .15s;}
  .tab:hover{background:var(--surface2);}
  .tab.active{background:var(--primary); border-color:var(--primary); color:var(--on-primary); font-weight:600;}

  /* ---------- grid ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:1.15rem; margin:1.6rem 0 3.5rem;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; transition:transform .2s, box-shadow .2s, border-color .2s; display:flex; flex-direction:column;}
  .card:hover{transform:translateY(-4px); border-color:var(--outline); box-shadow:var(--shadow);}
  .avatar{height:205px; display:flex; align-items:center; justify-content:center; font-size:3rem; font-weight:800; position:relative; overflow:hidden;}
  .avatar img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 18%; opacity:0; transition:opacity .4s;}
  .avatar img.loaded{opacity:1;}
  .badge{position:absolute; top:10px; right:10px; z-index:2; display:inline-flex; align-items:center; gap:.3rem; font-size:.72rem; font-weight:600; padding:.3rem .65rem; border-radius:999px; background:var(--badge-bg); backdrop-filter:blur(6px);}
  .badge.yes{color:var(--green);} .badge.no{color:var(--red);} .badge.unknown{color:var(--amber);}
  .card .body{padding:1rem 1.1rem 1.15rem; display:flex; flex-direction:column; flex:1;}
  .card .name{font-weight:600; font-size:1.03rem; letter-spacing:-.01em;}
  .card .role{font-size:.8rem; color:var(--muted); margin-top:.12rem;}
  .src{display:block; margin-top:.4rem; font-size:.75rem;}
  .pledge-btn{margin-top:auto; padding-top:.85rem;}
  .pledge-btn button{width:100%; background:transparent; border:1px solid var(--outline); color:var(--primary); padding:.55rem; border-radius:999px; cursor:pointer; font-weight:600; font-size:.85rem; font-family:inherit; transition:.15s;}
  .pledge-btn button:hover{background:var(--primary); border-color:var(--primary); color:var(--on-primary);}
  .pledge-btn button.thank{color:var(--green);}
  .pledge-btn button.thank:hover{background:var(--green); border-color:var(--green); color:#0b2b16;}
  .appr-body button{width:100%; margin-top:.55rem; background:transparent; border:1px solid var(--outline); color:var(--green); padding:.45rem; border-radius:999px; cursor:pointer; font-weight:600; font-size:.78rem; font-family:inherit;}
  .appr-body button:hover{background:var(--green); border-color:var(--green); color:#0b2b16;}

  /* ---------- petition ---------- */
  section.petition{position:relative; overflow:hidden; background:var(--pet-grad); border:1px solid var(--line); border-radius:28px; padding:3rem 2rem; margin:1rem 0 3.5rem; text-align:center;}
  section.petition h2{font-size:clamp(1.5rem,3.4vw,2rem); font-weight:800; letter-spacing:-.02em;}
  section.petition p{color:var(--muted); margin:0.7rem auto 1.6rem; max-width:640px;}
  .pet-form{display:flex; gap:.7rem; flex-wrap:wrap; justify-content:center;}
  .pet-form input{flex:1 1 220px; max-width:300px; padding:.85rem 1.2rem; border-radius:999px; border:1px solid var(--outline); background:var(--input-bg); color:var(--text); font-size:.95rem; font-family:inherit;}
  .pet-form input:focus{outline:2px solid var(--primary); border-color:transparent;}
  .pet-count{margin-top:1.1rem; font-weight:600; color:var(--green);}

  /* ---------- modal ---------- */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.74); display:none; align-items:center; justify-content:center; z-index:50; padding:1rem;}
  .modal.open{display:flex;}
  .modal-box{background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:1.8rem; max-width:560px; width:100%; max-height:92vh; overflow:auto;}
  .modal-box h3{margin-bottom:1rem; font-weight:700; letter-spacing:-.01em;}
  .modal-box input{width:100%; padding:.8rem 1.15rem; border-radius:999px; border:1px solid var(--outline); background:var(--bg); color:var(--text); font-size:.95rem; margin-bottom:1rem; font-family:inherit;}
  .modal-actions{display:flex; gap:.6rem; flex-wrap:wrap;}
  .modal-actions button{flex:1; padding:.72rem 1rem; border-radius:999px; border:none; font-weight:600; cursor:pointer; font-size:.9rem; font-family:inherit; white-space:nowrap;}
  .btn-primary{background:var(--primary); color:var(--on-primary);}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--outline) !important;}
  .btn-ghost:hover{background:var(--surface2);}
  #certCanvas{width:100%; border-radius:16px; margin:.2rem 0 1rem; display:none;}

  footer{border-top:1px solid var(--line); padding:2.2rem 0 3rem; color:var(--muted); font-size:.83rem; text-align:center;}
  footer p{max-width:720px; margin:0 auto .55rem;}

  #toTop{position:fixed; right:20px; bottom:22px; z-index:40; width:46px; height:46px; border-radius:50%;
    border:none; background:var(--primary); color:var(--on-primary); font-size:1.35rem; font-weight:700;
    cursor:pointer; box-shadow:var(--shadow); opacity:0; pointer-events:none; transform:translateY(12px);
    transition:opacity .25s, transform .25s;}
  #toTop.show{opacity:1; pointer-events:auto; transform:translateY(0);}
  #toTop:hover{filter:brightness(1.08);}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap topbar-in">
    <div class="brand"><span class="fist"></span> <span data-i18n="brand">StandWithStudents</span><span class="dot">.</span></div>
    <div style="display:flex; align-items:center; gap:.9rem;">
      <a href="#appr" class="nav-link" data-i18n="apprLink"></a>
      <button id="themeBtn" onclick="toggleTheme()" title="Theme" style="background:transparent; border:1px solid var(--outline); border-radius:999px; width:38px; height:38px; cursor:pointer; font-size:1.05rem; line-height:1; color:var(--text);">🌙</button>
      <div class="lang-toggle">
        <button id="btnEn" onclick="setLang('en')">EN</button>
        <button id="btnHi" onclick="setLang('hi')">हिंदी</button>
      </div>
    </div>
  </div>
</div>

<header class="hero">
  <div class="wrap">
    <span class="overline" data-i18n="overline"></span>
    <h1 id="heroTitle"></h1>
    <p class="tagline" id="heroTag"></p>
    <p class="msg" id="heroMsg"></p>
    <div class="cta">
      <button class="btn btn-fill" onclick="document.getElementById('petition').scrollIntoView()" data-i18n="ctaPledge"></button>
      <button class="btn btn-line" onclick="shareSite(this)" data-i18n="ctaShare"></button>
    </div>
    <div class="counts">
      <div class="count-card"><div class="num green" id="cYes">0</div><div class="lbl" data-i18n="spokeUp"></div></div>
      <div class="count-card"><div class="num red" id="cNo">0</div><div class="lbl" data-i18n="silent"></div></div>
    </div>
  </div>
</header>

<nav class="tabs"><div class="wrap"><div class="tabs-in" id="tabs"></div></div></nav>

<div class="wrap">
  <div class="grid" id="grid"></div>

  <section class="petition" id="petition">
    <h2 data-i18n="petTitle"></h2>
    <p data-i18n="petDesc"></p>
    <div class="pet-form">
      <input id="petName" type="text" maxlength="40">
      <input id="petCity" type="text" maxlength="30">
      <input id="petContact" type="text" maxlength="60">
      <button class="btn btn-fill" onclick="signPetition()" data-i18n="petBtn"></button>
    </div>
    <div class="pet-count" id="petMsg"></div>
  </section>
</div>

<section class="appr" id="appr">
  <div class="wrap">
    <h2 data-i18n="apprTitle"></h2>
    <p data-i18n="apprDesc"></p>
    <div class="appr-row" id="apprRow"></div>
  </div>
</section>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <input id="certName" type="text" maxlength="40">
    <canvas id="certCanvas" width="1080" height="1080"></canvas>
    <div class="modal-actions">
      <button class="btn-primary" onclick="makeCert()" data-i18n="mGen"></button>
      <button class="btn-ghost" id="dlBtn" style="display:none" onclick="downloadCert()" data-i18n="mDl"></button>
      <button class="btn-ghost" id="shareBtn" style="display:none" onclick="shareCert()" data-i18n="mShare"></button>
      <button class="btn-ghost" onclick="closeModal()" data-i18n="mClose"></button>
    </div>
  </div>
</div>

<footer>
  <div class="wrap">
    <p><b data-i18n="fContactT"></b> <a href="mailto:contact@standwithstudents.org">contact@standwithstudents.org</a></p>
    <p><b data-i18n="fDiscT"></b> <span data-i18n="fDisc"></span></p>
    <p data-i18n="fPhotos"></p>
    <p data-i18n="fMade"></p>
  </div>
</footer>

<button id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">↑</button>

let LANG = localStorage.getItem("lang") || "en";
let activeCat = "all";
let certPerson = null;
const t = k => I18N[LANG][k];
const dispName = p => (LANG==="hi" && NAME_HI[p.name]) ? NAME_HI[p.name] : p.name;
const dispRole = p => (LANG==="hi" && ROLE_HI[p.role]) ? ROLE_HI[p.role] : p.role;

const COLORS = ["#f28b82","#fdd663","#81c995","#8ab4f8","#c58af9","#78d9ec","#fcad70","#ff8bcb"];
function initials(n){ return n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function hashOf(n){ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))>>>0; return h; }

function setLang(l){ LANG=l; localStorage.setItem("lang",l); applyLang(); }

/* ---------- theme ---------- */
let THEME = localStorage.getItem("theme") || "light";
function applyTheme(){
  document.documentElement.setAttribute("data-theme", THEME);
  document.getElementById("themeBtn").textContent = THEME==="dark" ? "🌙" : "☀️";
}
function toggleTheme(){ THEME = THEME==="dark" ? "light" : "dark"; localStorage.setItem("theme", THEME); applyTheme(); }
applyTheme();
function applyLang(){
  document.documentElement.lang = LANG;
  document.getElementById("btnEn").classList.toggle("active", LANG==="en");
  document.getElementById("btnHi").classList.toggle("active", LANG==="hi");
  document.getElementById("heroTitle").innerHTML = t("heroTitle");
  document.getElementById("heroTag").textContent = t("heroTag");
  document.getElementById("heroMsg").textContent = t("heroMsg");
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.getElementById("petName").placeholder = t("petName");
  document.getElementById("petCity").placeholder = t("petCity");
  document.getElementById("petContact").placeholder = t("petContact");
  document.getElementById("certName").placeholder = t("mName");
  document.getElementById("petMsg").textContent = "";
  renderTabs(); renderGrid(); renderAppreciation();
}

function renderAppreciation(){
  const row = document.getElementById("apprRow");
  const list = PEOPLE.filter(p=>p.status==="yes");
  document.getElementById("appr").style.display = list.length ? "" : "none";
  row.innerHTML = list.map(p=>{
    const note = (LANG==="hi" ? (p.noteHi||p.note) : p.note) || "";
    const col = COLORS[hashOf(p.name)%COLORS.length];
    const src = p.source ? `<a href="${p.source}" target="_blank" rel="noopener">${t("apprSrc")}</a>` : "";
    return `<div class="appr-card">
      <div class="appr-photo" style="background:${col}22"><span style="color:${col}">${initials(p.name)}</span><img data-wiki="${(p.wiki||p.name).replace(/"/g,'&quot;')}" alt="${p.name}"><span class="badge yes">✓</span></div>
      <div class="appr-body">
        <div class="appr-name">${dispName(p)}</div>
        <div class="appr-note">${note}</div>
        ${src}
        <button onclick="openModal(${PEOPLE.indexOf(p)})">${t("thankBtn")}</button>
      </div>
    </div>`;
  }).join("");
  observeImages();
}

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = `<button class="tab ${activeCat==='all'?'active':''}" onclick="setCat('all')">${t("all")}</button>` +
    CATEGORIES.map(c=>`<button class="tab ${activeCat===c.id?'active':''}" onclick="setCat('${c.id}')">${c[LANG]}</button>`).join("");
}
function setCat(c){ activeCat=c; renderTabs(); renderGrid(); }

function renderGrid(){
  const g = document.getElementById("grid");
  const list = PEOPLE.filter(p=>activeCat==="all"||p.cat===activeCat);
  const stMeta = { yes:{cls:"yes",icon:"✓",key:"stYes"}, no:{cls:"no",icon:"✗",key:"stNo"}, unknown:{cls:"unknown",icon:"?",key:"stUnknown"} };
  g.innerHTML = list.map(p=>{
    const m = stMeta[p.status]||stMeta.unknown;
    const src = p.source ? `<a class="src" href="${p.source}" target="_blank" rel="noopener">${t("source")}</a>` : "";
    const idx = PEOPLE.indexOf(p);
    const col = COLORS[hashOf(p.name)%COLORS.length];
    return `<div class="card">
      <div class="avatar" style="background:${col}22">
        <span style="color:${col}">${initials(p.name)}</span>
        <img data-wiki="${(p.wiki||p.name).replace(/"/g,'&quot;')}" alt="${p.name}">
        <span class="badge ${m.cls}">${m.icon} ${t(m.key)}</span>
      </div>
      <div class="body">
        <div class="name">${dispName(p)}</div>
        <div class="role">${dispRole(p)}</div>
        ${p.status==="yes" && (p.note||p.noteHi) ? `<div class="appr-note">${LANG==="hi" ? (p.noteHi||p.note) : p.note}</div>` : ""}
        ${src}
        <div class="pledge-btn"><button class="${p.status==="yes"?"thank":""}" onclick="openModal(${idx})">${p.status==="yes"?t("thankBtn"):t("pledgeBtn")}</button></div>
      </div>
    </div>`;
  }).join("");
  updateCounts();
  observeImages();
}

function updateCounts(){
  document.getElementById("cYes").textContent = PEOPLE.filter(p=>p.status==="yes").length;
  document.getElementById("cNo").textContent  = PEOPLE.filter(p=>p.status==="no").length;
}

/* ---------- share the movement ---------- */
async function shareSite(btn){
  const data = { title: document.title, text: t("shareText"), url: location.href };
  if(navigator.share){ try{ await navigator.share(data); }catch(e){} }
  else{
    try{ await navigator.clipboard.writeText(t("shareText")+" "+location.href); }catch(e){}
    const old = btn.textContent; btn.textContent = t("copied");
    setTimeout(()=>{ btn.textContent = t("ctaShare"); }, 2200);
  }
}

/* ---------- photos (lazy-loaded from Wikipedia, freely licensed) ---------- */
const imgCache = {};
const imgObserver = new IntersectionObserver(entries=>{
  for(const e of entries){
    if(!e.isIntersecting) continue;
    imgObserver.unobserve(e.target);
    loadWikiImage(e.target);
  }
},{rootMargin:"300px"});

function observeImages(){
  document.querySelectorAll("img[data-wiki]:not([src])").forEach(img=>imgObserver.observe(img));
}

async function loadWikiImage(img){
  const title = img.dataset.wiki;
  try{
    if(!(title in imgCache)){
      const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title));
      const j = r.ok ? await r.json() : {};
      imgCache[title] = (j.thumbnail && j.thumbnail.source) ? j.thumbnail.source : null;
    }
    if(imgCache[title]){
      img.src = imgCache[title];
      img.onload = ()=>img.classList.add("loaded");
      img.onerror = ()=>img.remove();
    } else img.remove();
  }catch(e){ img.remove(); }
}

/* ---------- petition ---------- */
/* Paste your Google Apps Script Web App URL between the quotes to save pledges to your Sheet. */
const SHEET_ENDPOINT = "";

function signPetition(){
  const n = document.getElementById("petName").value.trim();
  if(!n){ document.getElementById("petMsg").textContent = t("petErr"); return; }
  const c = (parseInt(localStorage.getItem("pledgeCount")||"0")+1);
  localStorage.setItem("pledgeCount", c);
  const rec = { name:n, city:document.getElementById("petCity").value.trim(), contact:document.getElementById("petContact").value.trim(), lang:LANG, at:new Date().toISOString() };
  const sigs = JSON.parse(localStorage.getItem("signatures")||"[]");
  sigs.push(rec);
  localStorage.setItem("signatures", JSON.stringify(sigs));
  if(SHEET_ENDPOINT){
    fetch(SHEET_ENDPOINT, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(rec) }).catch(()=>{});
  }
  document.getElementById("petMsg").textContent = t("petThanks")(n, c);
  document.getElementById("certName").value = n;
  updateCounts();
  certPerson = { mode:"general" };
  document.getElementById("modalTitle").textContent = t("mTitleGeneral");
  document.getElementById("certCanvas").style.display="none";
  document.getElementById("dlBtn").style.display="none";
  document.getElementById("shareBtn").style.display="none";
  document.getElementById("modal").classList.add("open");
  makeCert();
}

/* ---------- certificate ---------- */
function openModal(idx){
  const p = PEOPLE[idx];
  const cat = CATEGORIES.find(c=>c.id===p.cat)||{};
  certPerson = { name:dispName(p), mode: p.status==="yes" ? "thanks" : "pledge",
    verb: LANG==="hi" ? (cat.verbHi||"का समर्थन नहीं करूँगा/करूँगी:") : (cat.verbEn||"support") };
  document.getElementById("modalTitle").textContent = (certPerson.mode==="thanks" ? t("mTitleThanks") : t("mTitle"))(dispName(p));
  document.getElementById("certCanvas").style.display="none";
  document.getElementById("dlBtn").style.display="none";
  document.getElementById("shareBtn").style.display="none";
  document.getElementById("modal").classList.add("open");
}
function closeModal(){ document.getElementById("modal").classList.remove("open"); }

const SERIF = "'Playfair Display',Georgia,'Noto Sans Devanagari',serif";
const CERT = { navy:"#1c2a52", gold:"#c9a227", ink:"#33333c", faded:"#6b6353", green:"#0e6b2e", chakra:"#000080" };

function royalBase(x, W, H, title, sub){
  let g = x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#fdf9ee"); g.addColorStop(.55,"#f9f1dd"); g.addColorStop(1,"#f3e9d0");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  let v = x.createRadialGradient(W/2,H/2,300,W/2,H/2,760);
  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(120,90,30,.10)");
  x.fillStyle=v; x.fillRect(0,0,W,H);
  // Ashoka Chakra watermark
  x.save(); x.strokeStyle="rgba(0,0,128,.07)"; x.lineWidth=3;
  x.beginPath(); x.arc(W/2,H/2,240,0,Math.PI*2); x.stroke();
  x.beginPath(); x.arc(W/2,H/2,34,0,Math.PI*2); x.stroke();
  for(let i=0;i<24;i++){ const a=i*Math.PI/12;
    x.beginPath(); x.moveTo(W/2+34*Math.cos(a),H/2+34*Math.sin(a));
    x.lineTo(W/2+240*Math.cos(a),H/2+240*Math.sin(a)); x.stroke(); }
  x.restore();
  // double frame: navy, gold, hairline
  x.strokeStyle=CERT.navy; x.lineWidth=14; x.strokeRect(28,28,W-56,H-56);
  x.strokeStyle=CERT.gold; x.lineWidth=3;  x.strokeRect(52,52,W-104,H-104);
  x.strokeStyle=CERT.navy; x.lineWidth=1.5; x.strokeRect(62,62,W-124,H-124);
  x.fillStyle=CERT.gold;
  [[52,52],[W-52,52],[52,H-52],[W-52,H-52]].forEach(c=>{
    x.save(); x.translate(c[0],c[1]); x.rotate(Math.PI/4); x.fillRect(-9,-9,18,18); x.restore(); });
  // tricolor ribbons
  const rx=86, rw=W-172;
  x.fillStyle="#FF9933"; x.fillRect(rx,84,rw,9);
  x.fillStyle="#ffffff"; x.fillRect(rx,93,rw,9);
  x.fillStyle="#138808"; x.fillRect(rx,102,rw,9);
  x.fillStyle="#FF9933"; x.fillRect(rx,H-111,rw,9);
  x.fillStyle="#ffffff"; x.fillRect(rx,H-102,rw,9);
  x.fillStyle="#138808"; x.fillRect(rx,H-93,rw,9);
  // heading
  x.textAlign="center";
  x.fillStyle=CERT.navy; x.font="700 50px "+SERIF;
  x.fillText(title, W/2, 208);
  goldRule(x, W/2, 240, 300);
  x.fillStyle="#8a6d1d"; x.font="italic 400 28px "+SERIF;
  x.fillText(sub, W/2, 290);
}
function goldRule(x, cx, y, half){
  x.strokeStyle=CERT.gold; x.lineWidth=2;
  x.beginPath(); x.moveTo(cx-half,y); x.lineTo(cx-16,y); x.moveTo(cx+16,y); x.lineTo(cx+half,y); x.stroke();
  x.save(); x.translate(cx,y); x.rotate(Math.PI/4); x.fillStyle=CERT.gold; x.fillRect(-7,-7,14,14); x.restore();
}
function drawSeal(x, cx, cy, r){
  x.save();
  x.strokeStyle=CERT.gold; x.lineWidth=5; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.stroke();
  x.lineWidth=2; x.beginPath(); x.arc(cx,cy,r-9,0,Math.PI*2); x.stroke();
  x.strokeStyle=CERT.chakra; x.lineWidth=2;
  x.beginPath(); x.arc(cx,cy,r-24,0,Math.PI*2); x.stroke();
  x.beginPath(); x.arc(cx,cy,7,0,Math.PI*2); x.stroke();
  for(let i=0;i<24;i++){ const a=i*Math.PI/12;
    x.beginPath(); x.moveTo(cx+7*Math.cos(a),cy+7*Math.sin(a));
    x.lineTo(cx+(r-24)*Math.cos(a),cy+(r-24)*Math.sin(a)); x.stroke(); }
  x.restore();
}
function certFinish(x, W, H, cv){
  x.fillStyle=CERT.faded; x.font="400 25px "+SERIF; x.textAlign="left";
  x.fillText(new Date().toLocaleDateString(LANG==="hi"?"hi-IN":"en-IN",{day:"numeric",month:"long",year:"numeric"}), 120, H-160);
  x.strokeStyle="#b5a878"; x.lineWidth=1.5;
  x.beginPath(); x.moveTo(120,H-192); x.lineTo(400,H-192); x.stroke();
  x.font="italic 400 22px "+SERIF; x.fillText(t("certTag"), 120, H-208+0);
  drawSeal(x, W-200, H-215, 62);
  x.textAlign="center";
  cv.style.display="block";
  document.getElementById("dlBtn").style.display="block";
  if(navigator.share) document.getElementById("shareBtn").style.display="block";
}

function makeCert(){
  const user = document.getElementById("certName").value.trim() || t("anon");
  const cv = document.getElementById("certCanvas"), x = cv.getContext("2d");
  const W=1080,H=1080;
  if(certPerson.mode==="thanks"){ makeThanksCert(x, W, H, user, cv); return; }
  if(certPerson.mode==="general"){ makeGeneralCert(x, W, H, user, cv); return; }
  royalBase(x, W, H, t("certHead").trim(), t("certSub"));
  x.fillStyle=CERT.navy; x.font="700 44px "+SERIF;
  x.fillText(t("certI")(user), W/2, 400);
  x.fillStyle=CERT.ink; x.font="400 34px "+SERIF;
  wrapText(x, t("certPledge")(certPerson.verb), W/2, 465, 860, 48);
  x.fillStyle=CERT.navy; x.font="700 56px "+SERIF;
  x.fillText(certPerson.name, W/2, 610);
  goldRule(x, W/2, 640, 220);
  x.fillStyle=CERT.ink; x.font="400 34px "+SERIF;
  wrapText(x, t("certUntil"), W/2, 700, 860, 48);
  x.fillStyle=CERT.green; x.font="700 34px "+SERIF;
  x.fillText(t("certMotto"), W/2, 810);
  certFinish(x, W, H, cv);
}

function makeGeneralCert(x, W, H, user, cv){
  royalBase(x, W, H, t("certHead").trim(), t("certSub"));
  x.fillStyle=CERT.navy; x.font="700 44px "+SERIF;
  x.fillText(t("certI")(user), W/2, 405);
  x.fillStyle=CERT.ink; x.font="400 36px "+SERIF;
  wrapText(x, t("certGBody"), W/2, 475, 860, 52);
  wrapText(x, t("certGUntil"), W/2, 645, 860, 52);
  x.fillStyle=CERT.green; x.font="700 34px "+SERIF;
  x.fillText(t("certMotto"), W/2, 790);
  certFinish(x, W, H, cv);
}

function makeThanksCert(x, W, H, user, cv){
  royalBase(x, W, H, t("certTHead").trim(), t("certSub"));
  x.fillStyle=CERT.ink; x.font="italic 400 34px "+SERIF;
  x.fillText(t("certTPresented"), W/2, 400);
  x.fillStyle=CERT.navy; x.font="700 62px "+SERIF;
  x.fillText(certPerson.name, W/2, 495);
  goldRule(x, W/2, 527, 260);
  x.fillStyle=CERT.ink; x.font="400 36px "+SERIF;
  wrapText(x, t("certTFor"), W/2, 590, 860, 50);
  x.fillStyle=CERT.green; x.font="700 34px "+SERIF;
  wrapText(x, t("certTMotto"), W/2, 700, 900, 48);
  x.fillStyle=CERT.faded; x.font="italic 400 27px "+SERIF;
  x.fillText(t("certTFrom")(user), W/2, 800);
  certFinish(x, W, H, cv);
}
if(document.fonts && document.fonts.load){ document.fonts.load("700 50px 'Playfair Display'"); document.fonts.load("italic 400 28px 'Playfair Display'"); }

function wrapText(x, text, cx, y, maxW, lh){
  const words = text.split(" "); let line="", yy=y;
  for(const w of words){
    const tst = line ? line+" "+w : w;
    if(x.measureText(tst).width > maxW){ x.fillText(line,cx,yy); line=w; yy+=lh; }
    else line=tst;
  }
  x.fillText(line,cx,yy);
}
function downloadCert(){
  const a=document.createElement("a");
  a.download="pledge-certificate.png";
  a.href=document.getElementById("certCanvas").toDataURL("image/png");
  a.click();
}
async function shareCert(){
  const cv=document.getElementById("certCanvas");
  cv.toBlob(async b=>{
    const f=new File([b],"pledge.png",{type:"image/png"});
    try{ await navigator.share({files:[f], title:"My Pledge", text:t("certTag")}); }
    catch(e){}
  });
}
